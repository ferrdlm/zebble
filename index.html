<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zebble</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f7f4ee;
      color: #33322e;
      font-family: serif, system-ui, -apple-system;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 1.5rem;
      user-select: none;
    }
    header {
      text-align: center;
      z-index: 10;
    }
    h1 {
      font-weight: 400;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: #2b2a26;
      margin-bottom: 0.3rem;
    }
    p {
      font-size: 0.85rem;
      color: #8c887d;
      letter-spacing: 0.05em;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    footer {
      z-index: 10;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    button {
      background: #ffffff90;
      backdrop-filter: blur(8px);
      border: 1px solid #e0dad0;
      padding: 0.6rem 1.2rem;
      border-radius: 99px;
      color: #4a473f;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    button:hover {
      background: #ffffff;
      border-color: #b0a898;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
    <header>
        <h1>zebble
        </h1>
    </header>
</body>
</html>
